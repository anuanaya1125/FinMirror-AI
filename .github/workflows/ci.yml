name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          GEMINI_API_KEY: "test-key"
          GEMINI_MODEL: "gemini-2.5-flash"
          LOG_LEVEL: "INFO"
        run: |
          pytest tests/ -v

  build-images:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build api image
        run: docker build -f infra/Dockerfile --target api -t finmirror-api:ci .

      - name: Build frontend image
        run: docker build -f infra/Dockerfile --target frontend -t finmirror-frontend:ci .
